<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xypher</title>

    <meta
        name="description"
        content="Xypher is a desktop Roblox account and session management application."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at top right,
                    #18202d 0%,
                    #0a0d12 45%,
                    #07090d 100%
                );

            color: #f4f7fb;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: min(900px, 92%);
            padding: 80px 20px;
            text-align: center;
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 28px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #5865f2,
                    #7c5cff
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;
            font-weight: 800;

            box-shadow:
                0 20px 60px rgba(88, 101, 242, 0.25);
        }

        h1 {
            margin: 0;

            font-size: clamp(48px, 8vw, 82px);
            letter-spacing: -4px;
            font-weight: 800;
        }

        .tagline {
            margin-top: 14px;

            color: #9ba6b7;

            font-size: 20px;
            line-height: 1.6;
        }

        .description {
            max-width: 650px;
            margin: 30px auto 0;

            color: #7f8b9d;

            font-size: 15px;
            line-height: 1.8;
        }

        .links {
            margin-top: 42px;

            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .links a {
            display: inline-block;

            padding: 12px 20px;

            border-radius: 8px;

            background: #151b25;
            border: 1px solid #242d3b;

            color: #dce3ed;

            text-decoration: none;

            transition:
                background 0.2s,
                border-color 0.2s,
                transform 0.2s;
        }

        .links a:hover {
            background: #1c2532;
            border-color: #5865f2;

            transform: translateY(-2px);
        }

        footer {
            margin-top: 70px;

            color: #515d6e;

            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            X
        </div>

        <h1>Xypher</h1>

        <div class="tagline">
            Roblox Account &amp; Session Management
        </div>

        <p class="description">
            Xypher is a desktop application designed to help users
            organize and manage their own Roblox accounts and
            Roblox sessions from a single interface.
        </p>

        <div class="links">
            <a href="privacy.html">
                Privacy Policy
            </a>

            <a href="terms.html">
                Terms of Service
            </a>
        </div>

        <footer>
            © 2026 Xypher. All rights reserved.
        </footer>

    </main>

</body>
</html>
